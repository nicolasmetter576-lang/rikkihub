# locale-tui 配置文件

# 项目根路径 (相对于 locale-tui 目录)
project_root: ".."

# 模块配置
modules:
  - name: "app"
    res_path: "app/src/main/res"
    source_patterns:
      - "app/src/main/java/**/*.kt"
      - "app/src/main/java/**/*.java"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/xml/*.xml"
  - name: "ai"
    res_path: "ai/src/main/res"
    source_patterns:
      - "ai/src/main/java/**/*.kt"
      - "ai/src/main/java/**/*.java"
  - name: "highlight"
    res_path: "highlight/src/main/res"
    source_patterns:
      - "highlight/src/main/java/**/*.kt"
      - "highlight/src/main/java/**/*.java"
      - "highlight/src/main/AndroidManifest.xml"
  - name: "search"
    res_path: "search/src/main/res"
    source_patterns:
      - "search/src/main/java/**/*.kt"
      - "search/src/main/java/**/*.java"
      - "search/src/main/AndroidManifest.xml"
  - name: "oauth"
    res_path: "oauth/src/main/res"
    source_patterns:
      - "oauth/src/main/java/**/*.kt"
      - "oauth/src/main/AndroidManifest.xml"

# 支持的语言列表
languages:
  - code: "values"
    name: "English"
    is_source: true
  - code: "values-zh"
    name: "Chinese (Simplified)"
  - code: "values-zh-rTW"
    name: "Chinese (Traditional)"
  - code: "values-ja"
    name: "Japanese"
  - code: "values-ko-rKR"
    name: "Korean"
  - code: "values-ru"
    name: "Russian"
  - code: "values-de"
    name: "German"
    # 用 du 称呼用户，AI 领域常用的英文术语保留英文；Polish/Refine/Recast 是三个不同的功能
    glossary:
      you: "du (informal; never Sie)"
      prompt: "Prompt (plural Prompts); never Eingabeaufforderung"
      system prompt: "Systemprompt"
      context: "Kontext"
      model: "Modell"
      provider: "Anbieter"
      assistant: "Assistent"
      agent: "Agent"
      tool: "Tool"
      reasoning: "Reasoning"
      thinking: "Denken"
      workspace: "Arbeitsbereich"
      skill: "Skill"
      memory: "Erinnerung (plural Erinnerungen); never Speicher"
      dreaming: "Träumen (name of the background memory-consolidation feature)"
      lorebook: "Lorebook"
      settings: "Einstellungen"
      polish: "Feinschliff (the chat input's rewrite button)"
      refine: "Verfeinern (candidate rewrites of selected text)"
      recast: "Umschreiben (rewrite selected text from a requirement)"

# AI 翻译配置
translation:
  batch_size: 10
  model: "deepseek-v4-flash"
  prompt_template: |
    You are a professional translator specializing in mobile app localization.

    App context: This is an AI LLM chat client app that allows users to chat with AI models from various providers (OpenAI, Anthropic, Google, DeepSeek, etc.). The UI strings contain AI/LLM-specific terminology that must be translated accurately.

    Translate the following Android app string resources from English to {target_language}.

    Important guidelines:
    1. Preserve all Android string placeholders like %1$s, %1$d, %s, %d exactly as they are
    2. Keep special characters like \n, \', &amp;, etc.
    3. Maintain the same tone and style (formal/informal) as the source
    4. For UI text, keep it concise
    5. Do not translate brand names or technical terms that should remain in English (e.g. OpenAI, Anthropic, Token, API)
    6. Use AI/LLM-specific terminology: translate "prompt" as "提示词" (not "提示"), "context" as "上下文", "model" as "模型", "inference" as "推理"

    Source strings (JSON format):
    {source_strings}

    Respond with a JSON object mapping the same keys to translated values.
    Only output the JSON, no other text.

# 显示设置
display:
  column_widths:
    key: 30
    translation: 25
  page_size: 50
